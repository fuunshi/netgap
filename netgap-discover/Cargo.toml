[package]
name = "netgap-discover"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
netgap-core = { path = "../netgap-core" }
dns-lookup.workspace = true
socket2.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# The raw-layer discovery paths — packet-level ARP, DHCP, ICMPv6 to the
# all-nodes multicast — are Unix. Their Windows equivalents would need Npcap
# installed to link, and a binary that will not start without a
# packet-capture driver is not something to hand someone as a download.
# Windows ARP goes through `SendARP` instead (see `arp_windows`), which needs
# nothing but the system libraries.
[target.'cfg(unix)'.dependencies]
pnet.workspace = true
pnet_datalink.workspace = true
pnet_packet.workspace = true
libc.workspace = true
