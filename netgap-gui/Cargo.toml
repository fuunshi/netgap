[package]
name = "netgap-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "netgap-gui"
path = "src/main.rs"

[dependencies]
# Window, input and rendering. The default glow backend talks to the system
# OpenGL that every desktop already has; wgpu would drag in a second graphics
# stack for no benefit on a dashboard.
eframe = "0.33.3"
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
netgap-core = { path = "../netgap-core" }
netgap-engine = { path = "../netgap-engine" }
netgap-interfaces = { path = "../netgap-interfaces" }
netgap-report = { path = "../netgap-report" }
netgap-storage = { path = "../netgap-storage" }
# Scheduled scans compare two results with the same change detection the
# command line uses, so the window and `netgap watch` never disagree about
# what changed.
netgap-trends = { path = "../netgap-trends" }

# The tray icon and its menu are StatusNotifierItem objects served over D-Bus.
# zbus is already in the tree for accessibility, and unlike tray-icon it does
# not link GTK, so the build needs no desktop development headers.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
