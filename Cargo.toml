[workspace]
members = [
    "netgap-core",
    "netgap-interfaces",
    "netgap-discover",
    "netgap-scan",
    "netgap-report",
    "netgap-raw-sockets",
    "netgap-mdns",
    "netgap-fingerprint",
    "netgap-assess",
    "netgap-probes",
    "netgap-storage",
    "netgap-services",
    "netgap-cli", "netgap-trends", "netgap-threat-intel", "netgap-webhooks",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Pranil Shrestha"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
config = "0.13"
dns-lookup = "2"
futures = "0.3"
libc = "0.2"
ipnetwork = "0.20"
mdns-sd = "0.10"
network-interface = "1.1"
notify-rust = "4"
pnet = "0.34"
pnet_datalink = "0.34"
pnet_packet = "0.34"
rand = "0.8"
crossterm = "0.27"
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
toml = "0.8"
# Test-only helpers. Declared here so members can opt in with `workspace = true`;
# this key is a catalog, so nothing is built unless a crate asks for it.
assert_cmd = "2"
predicates = "3"
