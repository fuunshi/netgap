name: Release

# Builds and publishes two downloads per platform, because they are two
# different things to run:
#
#   netgap      the engine and command line (scan, ui, report, ...)
#   netgap-gui  the window application, started with a click
#
# They share the same engine and the same scan history, but a person who
# wants the window should not have to unpack a command line tool to find it.
#
# The version comes from the tags: the first release is v1.0.0, and each one
# after it takes the next patch number.
#
# Publishing is deliberate, not automatic. A push to main runs the tests; a
# release is a decision — it hands a new version to everyone who downloads,
# and a version nobody can tell apart from the last one is noise. Start it
# from the Actions tab ("Run workflow") when the code is worth shipping.
on:
  # For building without publishing: set dry_run to skip the release step.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the binaries but do not publish a release"
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time. Two pushes in quick succession would otherwise race
# to claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      cli_linux: ${{ steps.names.outputs.cli_linux }}
      cli_windows: ${{ steps.names.outputs.cli_windows }}
      gui_linux: ${{ steps.names.outputs.gui_linux }}
      gui_windows: ${{ steps.names.outputs.gui_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are how the next version is worked out.
          fetch-depth: 0

      - name: Take the next patch version
        id: next
        run: |
          set -euo pipefail
          # Highest version tag so far, by version order rather than
          # alphabetically (v1.10.0 is newer than v1.9.0).
          latest=$(git tag --list 'v[0-9]*' | sort -V | tail -1)

          if [ -z "$latest" ]; then
            version="1.0.0"
          else
            base="${latest#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "$patch" in
              ''|*[!0-9]*) patch=0 ;;
            esac
            version="$major.$minor.$((patch + 1))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: ${latest:-none})"

      # Both downloads are written by two jobs that know nothing about each
      # other, so the two names live here once.
      - name: Name the archives
        id: names
        run: |
          set -euo pipefail
          v="${{ steps.next.outputs.version }}"
          echo "cli_linux=netgap-$v-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "cli_windows=netgap-$v-windows-x86_64.zip" >> "$GITHUB_OUTPUT"
          echo "gui_linux=netgap-gui-$v-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "gui_windows=netgap-gui-$v-windows-x86_64.zip" >> "$GITHUB_OUTPUT"

  build-cli:
    name: Command line for ${{ matrix.label }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not glibc: a binary built against the runner's glibc only
          # runs on distributions at least that new. This one is static, so it
          # runs on anything.
          - os: ubuntu-latest
            label: Linux x86_64 (static)
            target: x86_64-unknown-linux-musl
            archive: ${{ needs.version.outputs.cli_linux }}
          - os: windows-latest
            label: Windows x86_64
            target: x86_64-pc-windows-msvc
            archive: ${{ needs.version.outputs.cli_windows }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the one place the compiler version is written;
      # read it rather than repeating the number here, or the two drift apart.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml has no channel line" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}

      # The musl target needs a C toolchain for the bundled SQLite.
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools


      - name: Build
        shell: bash
        env:
          # The tag points at a commit whose Cargo.toml still says the
          # workspace version; the stamp is what makes the binary report the
          # version being released, and a source package can set it too.
          NETGAP_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --bin netgap --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/netgap" "$staging/"
          # The licence travels with the binary: Apache-2.0 requires handing
          # a copy to everyone who receives the work.
          cp LICENSE-MIT LICENSE-APACHE "$staging/"
          tar -czf "${{ matrix.archive }}" -C "$staging" netgap LICENSE-MIT LICENSE-APACHE
          echo "built ${{ matrix.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          7z a "${{ matrix.archive }}" "./target/${{ matrix.target }}/release/netgap.exe" LICENSE-MIT LICENSE-APACHE
          echo "built ${{ matrix.archive }}"

      # The Debian package is built from the same static binary the tarball
      # carries, so it downloads the tools a Debian system already has.
      - name: Package the .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packaging/deb/build.sh netgap "${{ needs.version.outputs.version }}" \
            "target/${{ matrix.target }}/release/netgap" "$PWD"

      # The RPM carries the same binary. rpmbuild is not installed on the
      # runner; it is the only extra tool this needs.
      - name: Package the .rpm (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y rpm >/dev/null
          packaging/rpm/build.sh netgap "${{ needs.version.outputs.version }}" \
            "target/${{ matrix.target }}/release/netgap" "$PWD"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: netgap_${{ needs.version.outputs.version }}_amd64.deb
          path: netgap_*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: netgap-${{ needs.version.outputs.version }}-1.x86_64.rpm
          path: netgap-[0-9]*.rpm
          if-no-files-found: error

  # The window application cannot be static: it loads the desktop's graphics
  # libraries when it starts. Building it inside the oldest commonly-deployed
  # Ubuntu keeps the glibc requirement low enough to run on Debian 12 and
  # Ubuntu 22.04, which a build on the current runner would not.
  build-gui-linux:
    name: Window application (Linux)
    needs: version
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential curl ca-certificates
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the one place the compiler version is written;
      # read it rather than repeating the number here, or the two drift apart.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml has no channel line" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}


      - name: Build
        env:
          # The window shows its version in the corner; the stamp is what
          # makes it the one being released.
          NETGAP_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --bin netgap-gui

      # The archive is what a person unpacks when they want the window: the
      # binary, the icon and menu entry that make it clickable, and a script
      # that installs all three for the current user.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ needs.version.outputs.gui_linux }}"
          staging=$(mktemp -d)
          cp target/release/netgap-gui "$staging/"
          cp netgap-gui/assets/netgap.svg "$staging/"
          cp netgap-gui/assets/netgap.desktop "$staging/"
          cp netgap-gui/assets/install.sh "$staging/"
          cp netgap-gui/assets/README.txt "$staging/"
          # Apache-2.0 requires anyone who receives the work to get the
          # licence text with it.
          cp LICENSE-MIT LICENSE-APACHE "$staging/"
          chmod 0755 "$staging/netgap-gui" "$staging/install.sh"
          chmod 0644 "$staging/netgap.svg" "$staging/netgap.desktop" "$staging/README.txt" "$staging/LICENSE-MIT" "$staging/LICENSE-APACHE"
          tar -czf "$archive" -C "$staging" .
          echo "built $archive"
          tar -tzvf "$archive"

      # The .deb installs the same binary, icon and menu entry into the system
      # paths, for the machines where a package manager should own them.
      - name: Package the .deb
        shell: bash
        run: |
          set -euo pipefail
          packaging/deb/build.sh netgap-gui "${{ needs.version.outputs.version }}" \
            target/release/netgap-gui "$PWD"

      - name: Package the .rpm
        shell: bash
        run: |
          set -euo pipefail
          apt-get update >/dev/null
          apt-get install -y --no-install-recommends rpm >/dev/null
          packaging/rpm/build.sh netgap-gui "${{ needs.version.outputs.version }}" \
            target/release/netgap-gui "$PWD"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.gui_linux }}
          path: ${{ needs.version.outputs.gui_linux }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: netgap-gui_${{ needs.version.outputs.version }}_amd64.deb
          path: netgap-gui_*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: netgap-gui-${{ needs.version.outputs.version }}-1.x86_64.rpm
          path: netgap-gui-*.rpm
          if-no-files-found: error

  build-gui-windows:
    name: Window application (Windows)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the one place the compiler version is written;
      # read it rather than repeating the number here, or the two drift apart.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml has no channel line" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-gui-x86_64-pc-windows-msvc


      - name: Build
        shell: bash
        env:
          NETGAP_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --bin netgap-gui --target x86_64-pc-windows-msvc

      # A single .exe: double-clicking it is the whole install. The manifest
      # marks it as a Windows subsystem binary, so it opens without a console
      # window behind it.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ needs.version.outputs.gui_windows }}"
          7z a "$archive" "./target/x86_64-pc-windows-msvc/release/netgap-gui.exe" LICENSE-MIT LICENSE-APACHE
          echo "built $archive"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.gui_windows }}
          path: ${{ needs.version.outputs.gui_windows }}
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build-cli, build-gui-linux, build-gui-windows]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    # Signing and provenance need an identity that comes from GitHub rather
    # than from a key stored in this repository: the job mints a short-lived
    # OIDC token, Sigstore's CA turns it into a certificate naming this
    # repository and workflow, and the signature is logged in a public
    # transparency log. Nothing long-lived is kept here, and nothing has to
    # be rotated.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # winget manifests name one version, one URL and one hash, so they are
      # written here from the archive that was just built, and travel with the
      # release. The submit to microsoft/winget-pkgs is a reviewed step a
      # person does; this is its input.
      - name: Write the winget manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GUI_WINDOWS: ${{ needs.version.outputs.gui_windows }}
        run: |
          set -euo pipefail
          sha=$(sha256sum "dist/$GUI_WINDOWS" | cut -d' ' -f1)
          packaging/winget/make-manifests.sh "$VERSION" "$sha" dist
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y zip >/dev/null
          (cd dist && zip -qr "netgap-winget-$VERSION.zip" manifests)
          unzip -l "dist/netgap-winget-$VERSION.zip"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -lh
          # For a tool people download and run, a checksum in the release is
          # the difference between verifying the download and hoping. Bare
          # names, not ./, because the attestation reads this file too.
          sha256sum *.tar.gz *.zip *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      # A checksum file anyone can replace proves the download arrived
      # intact, not that it came from here. Signing it keyless ties it to
      # this repository and this workflow at the moment of the run, and the
      # bundle beside it is everything a verifier needs.
      - name: Sign the checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      # The same identity records build provenance for every file the
      # checksum file lists: subject, digest, repository, workflow, commit.
      # `gh attestation verify` reads it back without cosign.
      - name: Attest the artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          CLI_LINUX: ${{ needs.version.outputs.cli_linux }}
          CLI_WINDOWS: ${{ needs.version.outputs.cli_windows }}
          GUI_LINUX: ${{ needs.version.outputs.gui_linux }}
          GUI_WINDOWS: ${{ needs.version.outputs.gui_windows }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          Two downloads per platform, because they are two ways to use the same scanner:

          **The command line** — the engine, `netgap scan`, `netgap ui` and the reports.
          One binary, no extra files.

          **The window application** — a dashboard, a scan screen, a searchable device
          list and the history. Windows: unpack and double-click `netgap-gui.exe`.
          Linux: unpack and run `./install.sh` once to add Netgap to your applications
          menu, or just run `./netgap-gui`.

          Both read and write the same scan history, so a scan started in one shows
          up in the other.
          EOF
          )

          notes="$notes

          The files in this release:
          - $CLI_LINUX (Linux) and $CLI_WINDOWS (Windows) — the command line
          - $GUI_LINUX (Linux) and $GUI_WINDOWS (Windows) — the window application
          - netgap_*.deb and netgap-gui_*.deb (Debian, Ubuntu) — the same two,
            installed to /usr/bin with the icon and menu entry
          - netgap-*.rpm and netgap-gui-*.rpm (Fedora, openSUSE) — the same,
            installed by the system package manager
          - netgap-winget-*.zip — the winget manifests for this version, ready
            to submit to microsoft/winget-pkgs (see packaging/winget/README.md)
          - SHA256SUMS and SHA256SUMS.sigstore.json — the checksums and the
            Sigstore signature over them

          **Verifying a download.** Every archive carries a GitHub build
          provenance attestation, and the checksum file is signed keyless by
          this workflow. Either check proves the file was built here:

              gh attestation verify <file> --repo $GITHUB_REPOSITORY

              cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity-regexp \\
                  '^https://github\\.com/$GITHUB_REPOSITORY/\\.github/workflows/release\\.yml@refs/heads/main$' \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                SHA256SUMS
              sha256sum -c SHA256SUMS

          The README has the same commands at the download table.
          "

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$notes" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm \
            dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
          echo "Published $TAG"
