name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # An advisory is published against code that has not changed, so the audit
    # has to run on a timer as well as on commits.
    - cron: "43 5 * * 1"
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# The compiler is pinned in rust-toolchain.toml, so these jobs and a local
# checkout use the same rustc and clippy. Without it, a newly released lint
# would fail CI on a commit that passed on the machine that wrote it.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the one place the compiler version is written;
      # read it rather than repeating the number here, or the two drift apart.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml has no channel line" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      # `--locked` so CI builds the dependencies the lockfile pins rather than
      # silently resolving new ones.
      - run: cargo test --workspace --locked
      # The interface code the Windows build takes, exercised where a test
      # runner is cheap. Without this it would only ever run on Windows, which
      # is the machine nobody watching this workflow has.
      - run: cargo test --workspace --locked --features netgap-interfaces/portable-interfaces

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the one place the compiler version is written;
      # read it rather than repeating the number here, or the two drift apart.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml has no channel line" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The rest of this file runs on Linux, which means the Windows code paths
  # are only ever compiled when someone happens to build the release. That is
  # the wrong place to find out a `cfg(windows)` branch does not link, so this
  # job builds the whole workspace on Windows: it compiles the ARP discovery
  # through `SendARP` and links the two executables a person would download.
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the one place the compiler version is written;
      # read it rather than repeating the number here, or the two drift apart.
      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml has no channel line" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on a known vulnerability in any dependency in Cargo.lock. A
      # scanner shipping a vulnerable HTTP client or JSON parser is an awkward
      # look, and this is the only check that notices.
      - run: cargo audit
