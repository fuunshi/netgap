name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # An advisory is published against code that has not changed, so the audit
    # has to run on a timer as well as on commits.
    - cron: "43 5 * * 1"
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--locked` so CI builds the dependencies the lockfile pins rather than
      # silently resolving new ones.
      - run: cargo test --workspace --locked
      # The interface code the Windows build takes, exercised where a test
      # runner is cheap. Without this it would only ever run on Windows, which
      # is the machine nobody watching this workflow has.
      - run: cargo test --workspace --locked --features netgap-interfaces/portable-interfaces

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on a known vulnerability in any dependency in Cargo.lock. A
      # scanner shipping a vulnerable HTTP client or JSON parser is an awkward
      # look, and this is the only check that notices.
      - run: cargo audit
