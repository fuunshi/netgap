name: Release

# Builds a Linux binary and a Windows executable and publishes them as a
# GitHub release. The version comes from the tags: the first release is
# v1.0.0, and each one after it takes the next patch number.
#
# Only runs when code changes. A documentation commit does not need a new
# binary, and a release nobody can tell apart from the last one is noise.
on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  # For building without publishing: set dry_run to skip the release step.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the binaries but do not publish a release"
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time. Two pushes in quick succession would otherwise race
# to claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are how the next version is worked out.
          fetch-depth: 0

      - name: Take the next patch version
        id: next
        run: |
          set -euo pipefail
          # Highest version tag so far, by version order rather than
          # alphabetically (v1.10.0 is newer than v1.9.0).
          latest=$(git tag --list 'v[0-9]*' | sort -V | tail -1)

          if [ -z "$latest" ]; then
            version="1.0.0"
          else
            base="${latest#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "$patch" in
              ''|*[!0-9]*) patch=0 ;;
            esac
            version="$major.$minor.$((patch + 1))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: ${latest:-none})"

  build:
    name: Build for ${{ matrix.label }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not glibc: a binary built against the runner's glibc only
          # runs on distributions at least that new. This one is static, so it
          # runs on anything.
          - os: ubuntu-latest
            label: Linux x86_64 (static)
            target: x86_64-unknown-linux-musl
            archive: netgap-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          - os: windows-latest
            label: Windows x86_64
            target: x86_64-pc-windows-msvc
            archive: netgap-${{ needs.version.outputs.version }}-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The musl target needs a C toolchain for the bundled SQLite.
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The binary reports its own version, and a download whose --version
      # disagrees with its tag is a bug report waiting to happen. The manifest
      # is rewritten to the version being released, which is why this builds
      # without --locked: the lockfile's copy of the workspace version has to
      # move with it.
      - name: Set the version being released
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
          rm -f Cargo.toml.bak
          grep '^version' Cargo.toml

      - name: Build
        run: cargo build --release --bin netgap --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" netgap
          echo "built ${{ matrix.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          7z a "${{ matrix.archive }}" "./target/${{ matrix.target }}/release/netgap.exe"
          echo "built ${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # For a tool people download and run, a checksum in the release is
          # the difference between verifying the download and hoping.
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          echo "Published $TAG"
